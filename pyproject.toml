[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-games-solver"
version = "1.0.0"
description = "Solve LinkedIn's five daily puzzles (Tango, Queens, Mini Sudoku, Zip, Patches) from a screenshot, or play them automatically in the browser."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "yulun" }]
keywords = [
    "linkedin", "linkedin-games", "puzzle-solver", "tango", "queens",
    "sudoku", "zip", "patches", "opencv", "computer-vision",
    "constraint-programming", "cp-sat", "ortools", "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Image mode needs only these. 圖片模式只需要這些。
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ortools>=9.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
# Screen mode - capturing the screen and driving the mouse. Windows only.
# 螢幕模式 —— 擷取螢幕與操作滑鼠。僅限 Windows。
screen = ["mss>=9.0.0", "pyautogui>=0.9.54"]
build = ["pyinstaller>=6.0"]
dev = ["pyflakes"]

[project.scripts]
linkedin-games-solver = "linkedin_games_solver.ui.cli:main"

[project.gui-scripts]
linkedin-games-solver-gui = "linkedin_games_solver.ui.app:main"

[tool.setuptools.packages.find]
include = ["linkedin_games_solver*"]

[tool.setuptools.package-data]
linkedin_games_solver = ["py.typed"]
